<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  fetch('https://raw.githubusercontent.com/corecommit/PollyMC-Continued/main/CHANGELOG.md')
    .then(function (r) {
      if (!r.ok) throw new Error('CHANGELOG.md not found (' + r.status + ')');
      return r.text();
    })
    .then(renderChangelog)
    .catch(function () {
      document.getElementById('changelog').innerHTML = '<p>Could not load the changelog. ' +
        '<a href="https://github.com/corecommit/PollyMC-Continued/releases" target="_blank" rel="noopener">View releases on GitHub instead</a>.</p>';
    });

  function renderChangelog(md) {
    var lines = md.replace(/\r/g, '').split('\n');
    var out = [];
    var inList = false;
    function closeList() {
      if (inList) { out.push('</ul>'); inList = false; }
    }
    lines.forEach(function (line) {
      var t = line.trim();
      if (!t) { closeList(); return; }
      if (t.charAt(0) === '#') {
        closeList();
        var level = 0;
        while (t.charAt(level) === '#') level++;
        var text = t.slice(level).trim();
        var tag = 'h' + Math.min(level + 1, 4);
        var body = escapeHtml(text);
        var m = text.match(/^v?(\d+\.\d+\.\d+)$/);
        if (m) {
          body = '<a href="https://github.com/corecommit/PollyMC-Continued/releases/tag/v' + m[1] + '" target="_blank" rel="noopener">' + body + '</a>';
        }
        out.push('<' + tag + '>' + body + '</' + tag + '>');
      } else if (t.substr(0, 2) === '- ') {
        if (!inList) { out.push('<ul>'); inList = true; }
        var item = t.substr(2);
        var cls = '';
        if (/^\[.?/.test(item)) {
          var m = item.match(/^\[(.)\]\s*/);
          if (m) {
            if (m[1].toUpperCase() === 'F') cls = ' fix';
            else if (m[1].toUpperCase() === 'A') cls = ' add';
            else if (m[1].toUpperCase() === 'R') cls = ' rem';
            item = item.substr(m[0].length);
          }
        }
        out.push('<li class="tag' + cls + '">' + inline(escapeHtml(item)) + '</li>');
      } else {
        closeList();
        out.push('<p>' + inline(escapeHtml(t)) + '</p>');
      }
    });
    closeList();
    document.getElementById('changelog').innerHTML = out.join('\n');
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function inline(s) {
    return s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
            .replace(/`([^`]+)`/g, '<code>$1</code>');
  }
</script>
